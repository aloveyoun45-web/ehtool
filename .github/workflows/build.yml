name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build APK with Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/home/user/hostcwd kivy/buildozer:master buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eh-tool-apk
          path: bin/*.apk
